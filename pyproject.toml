[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hub-mcp"
version = "0.1.0"
description = "Serveur MCP stdio exposant les outils du Hub (HUB_stack)."
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
  "mcp>=1.0",
]

[project.scripts]
hub-mcp = "hub_mcp.server:main"

[tool.setuptools]
packages = ["hub_mcp"]
